<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills Test - 1st Quarter | Coffee Shop</title>

   
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        .menu-item {
             position: relative; /* In order to anchor the preview popup to certain items, I chose to put this code to make it neat looking, ma'am. */
        }

        .item-preview {
            position: absolute;
            top: 100%;
            left: 0;
            margin-top: 0.5rem;
            background: var(--panel-2);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 0.5rem;
            padding: 0.5rem;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-6px);
            transition: opacity 0.18s ease, transform 0.18s ease, visibility 0.18s;
            z-index: 20;
            pointer-events: none;
            box-shadow: 0 0.75rem 1.5rem rgba(0, 0, 0, 0.5);
        }

        .item-preview img {
            display: block;
            width: 140px;
            height: 140px;
            object-fit: cover;
            border-radius: 0.4rem;
        }

        .menu-item:hover .item-preview {
             opacity: 1;
            visibility: visible;
             transform: translateY(0);
        }
        .brand-logo {
             height: 32px;
             width: auto;
        }

        :root {
            --ink: #0b0713;
            --panel: #150c26;
            --panel-2: #1c1130;
            --violet: #8b5cf6;
            --violet-deep: #5b21b6;
            --violet-soft: #c4b5fd;
            --text: #f2eefb;
            --text-muted: #a99cc4;
        }

        html, body {
            height: 100%;
        }
        body {
            background: var(--ink);
            min-height: 100vh;
            font-family: 'Inter', system-ui, sans-serif;
            color: var(--text);
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background-color: var(--panel) !important;
            border-bottom: 1px solid rgba(139, 92, 246, 0.15);
        }
        .navbar-brand {
            font-family: 'Fraunces', serif;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: var(--violet-soft) !important;
        }
        .nav-link { color: var(--text-muted) !important; }
        .nav-link.active, .nav-link:hover { color: var(--text) !important; }

        .app-card {
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 1rem;
            box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.45);
            background: var(--panel);
        }
        .app-card .card-header {
            border-radius: 1rem 1rem 0 0;
            background: linear-gradient(90deg, var(--violet-deep), var(--violet));
            color: #fff;
            padding: 1.5rem;
        }
        .app-card .card-body h5 {
            color: var(--text);
        }
        .app-card .card-footer {
            background: var(--panel);
            border-top: 1px solid rgba(139, 92, 246, 0.15);
        }

        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1rem;
            background: var(--panel-2);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 0.5rem;
            margin-bottom: 0.6rem;
            transition: background 0.15s ease;
        }
        .menu-item:hover {
            background: #241938;
        }
        .menu-item label {
            font-weight: 600;
            color: var(--text);
            margin-left: 0.6rem;
            cursor: pointer;
        }
        .menu-item .price {
            color: var(--violet-soft);
            font-weight: 700;
        }
        .form-check-input {
            width: 1.2em;
            height: 1.2em;
            background-color: var(--panel);
            border-color: rgba(139, 92, 246, 0.4);
        }
        .form-check-input:checked {
            background-color: var(--violet);
            border-color: var(--violet);
        }
        .btn-order {
            background: linear-gradient(90deg, var(--violet-deep), var(--violet));
            border: none;
            font-weight: 600;
            letter-spacing: 0.5px;
            border-radius: 0.6rem;
        }
        .btn-order:hover {
            opacity: 0.92;
            color: #fff;
        }
        #show {
            min-height: 3rem;
        }
        .result-box {
            background: var(--panel-2);
            border-left: 5px solid var(--violet);
            border-radius: 0.5rem;
            padding: 1rem 1.25rem;
            color: var(--text);
        }
        .receipt-total {
            font-family: 'Fraunces', serif;
            font-weight: 600;
            font-size: 1.3rem;
            color: var(--violet-soft);
        }
        hr {
            border-color: rgba(139, 92, 246, 0.2);
        }
        .text-muted {
            color: var(--text-muted) !important;
        }
        footer {
            background-color: var(--panel) !important;
            color: var(--text-muted) !important;
            border-top: 1px solid rgba(139, 92, 246, 0.15);
        }
        py-terminal {
            display: none;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg">
        <div class="container">
            <img src="bb_salon_logo.png" alt="BB Salon" class="brand-logo">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">
                            <i class="fa-solid fa-barcode me-1"></i> SKU Generator
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="receipt_generator.html">
                            <i class="fa-solid fa-circle-info me-1"></i> Receipt Generaotr
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container py-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">

                <div class="card app-card">
                    <div class="card-header text-center">
    
                        <h1>ꨄ</h1>
                        <h3 class="mb-0">BB Salon Products</h3>
                        <small class="opacity-75"></small>
                    </div>

                    <div class="card-body p-4">
                        <h5 class="mb-3">
                            <i class="fa-solid fa-list-check me-1"></i> Menu
                        </h5>

                        <form id="order-form">
                            <div class="menu-item">
                                <div>
                                    <input class="form-check-input" type="checkbox" id="item1" value="300">
                                    <label id="item1-label" for="item1">SunSilk/CreamSilk Shampoo/Conditioner</label>
                                </div>
                                    <span class="price">₱300</span>
                                     <div class="item-preview">
                                    <img src="Sunsilk.png" alt="CreamSilk Shampoo/Conditioner">
                                </div>
   
                            </div>

                            <div class="menu-item">
                                <div>
                                    <input class="form-check-input" type="checkbox" id="item2" value="300">
                                    <label id="item2-label" for="item2">Pantene Shampoo/Conditioner</label>
                                </div>
                                <span class="price">₱300</span>
                                <div class="item-preview">
                                    <img src="Pantene.png" alt="CreamSilk Shampoo/Conditioner">
                                </div>
                                
                            </div>

                            <div class="menu-item">
                                <div>
                                    <input class="form-check-input" type="checkbox" id="item3" value="400">
                                    <label id="item3-label" for="item3">Dove Shampoo/Conditioner</label>
                                </div>
                                <span class="price">₱400</span>
                                <div class="item-preview">
                                    <img src="Dove.png" alt="CreamSilk Shampoo/Conditioner">
                                </div>
                            </div>

                            <div class="menu-item">
                                <div>
                                    <input class="form-check-input" type="checkbox" id="item4" value="300">
                                    <label id="item4-label" for="item4">Palmolive Shampoo/Conditioner</label>
                                </div>
                                <span class="price">₱300</span>
                                <div class="item-preview">
                                    <img src="Palmolive.png" alt="CreamSilk Shampoo/Conditioner">
                                </div>
                            </div>

                            <div class="menu-item">
                                <div>
                                    <input class="form-check-input" type="checkbox" id="item5" value="300">
                                    <label id="item5-label" for="item5">Head & Shoulders Shampoo/Conditioner</label>
                                </div>
                                <span class="price">₱300</span>
                                <div class="item-preview">
                                    <img src="Head.png" alt="CreamSilk Shampoo/Conditioner">
                                </div>
                            </div>

                            <div class="d-grid mt-4">
                                <button type="button" py-click="create_order" class="btn btn-order btn-lg text-white">
                                    <i class="fa-solid fa-receipt me-1"></i> Create Order
                                </button>
                            </div>
                        </form>

                        <hr class="my-4">

                        <div id="show">
                            <p class="text-muted text-center mb-0">Your order summary will appear here.</p>
                        </div>
                    </div>

                    <div class="card-footer text-center text-muted small py-3">
                        Select your items and click "Create Order"
                    </div>
                </div>

            </div>
        </div>
    </div>

    <footer class="text-center py-4">
        <div class="container">
            <p class="mb-1">
                <i class="fa-solid fa-code me-1"></i>
                SKU Generator, 1st Quarter Project, Llacer and Belleza
            </p>
        </div>
    </footer>

    <py-script src="main.py"></py-script>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
