<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1st Quarter Project | SKU Generator</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- HI ma'am. Elan and I wanted to make a salon/hairproduct themed project. We decided to use a cool theme purple for it. The fonts were picked in an attempt to look stylish or chic. We made use of !important so custom navbar colors override Bootstrap's defaults -->

    <style>
        .brand-logo {
             height: 32px;
             width: auto;
        }
        :root {
            --ink: #0b0713;
            --panel: #150c26;
            --panel-2: #1c1130;
            --violet: #8b5cf6;
            --violet-deep: #5b21b6;
            --violet-soft: #c4b5fd;
            --text: #f2eefb;
            --text-muted: #a99cc4;
        }

        * { font-family: 'Inter', system-ui, sans-serif; }

        body {
            background: var(--ink);
            min-height: 100vh;
            color: var(--text);
        }

        .navbar {
            background-color: var(--panel) !important;
            border-bottom: 1px solid rgba(139, 92, 246, 0.15);
        }
        .navbar-brand {
            font-family: 'Fraunces', serif;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: var(--violet-soft) !important;
        }
        .nav-link { color: var(--text-muted) !important; }
        .nav-link.active, .nav-link:hover { color: var(--text) !important; }

        .app-shell {
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 1.25rem;
            overflow: hidden;
            box-shadow: 0 2rem 4rem rgba(0, 0, 0, 0.45);
            background: var(--panel);
        }

        .form-side {
            padding: 3rem 2.5rem;
        }

        .brand-side {
            background:
                radial-gradient(circle at 20% 20%, rgba(139, 92, 246, 0.35), transparent 60%),
                linear-gradient(160deg, var(--violet-deep) 0%, #180a2e 75%);
            padding: 3rem 2.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 100%;
            position: relative;
        }
        .brand-mark {
            font-family: 'Fraunces', serif;
            font-optical-sizing: auto;
            font-weight: 300;
            font-size: 4rem;
            line-height: 0.95;
            color: var(--text);
        }
        .brand-mark strong {
            display: block;
            font-weight: 600;
            color: var(--violet-soft);
        }
        .brand-tagline {
            margin-top: 1.25rem;
            color: var(--text-muted);
            font-size: 0.95rem;
            max-width: 22ch;
        }
        .brand-icon {
            color: var(--violet-soft);
            font-size: 1.5rem;
            opacity: 0.8;
        }

        .form-label {
            font-weight: 500;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .form-select, .form-control {
            background-color: var(--panel-2);
            border: 1px solid rgba(139, 92, 246, 0.25);
            color: var(--text);
        }
        .form-select:focus, .form-control:focus {
            background-color: var(--panel-2);
            color: var(--text);
            border-color: var(--violet);
            box-shadow: 0 0 0 0.2rem rgba(139, 92, 246, 0.25);
        }
        .form-control::placeholder { color: #6b6080; }

        .btn-generate {
            background: linear-gradient(90deg, var(--violet-deep), var(--violet));
            border: none;
            font-weight: 600;
            letter-spacing: 0.3px;
            color: #fff;
            border-radius: 0.6rem;
        }
        .btn-generate:hover {
            opacity: 0.92;
            color: #fff;
        }

        hr {
            border-color: rgba(139, 92, 246, 0.2);
        }

        #sku_output { min-height: 3rem; }

        .result-box {
            background: var(--panel-2);
            border-left: 3px solid var(--violet);
            border-radius: 0.6rem;
            padding: 1rem 1.25rem;
        }
        .sku-code {
            font-family: 'Fraunces', serif;
            font-weight: 600;
            font-size: 1.5rem;
            color: var(--violet-soft);
            letter-spacing: 0.5px;
        }
        .text-muted { color: var(--text-muted) !important; }

        footer {
            background-color: var(--panel) !important;
            color: var(--text-muted) !important;
            border-top: 1px solid rgba(139, 92, 246, 0.15);
        }

        py-terminal { display: none; }

        @media (max-width: 767.98px) {
            .brand-side { padding: 2.5rem 2rem; }
            .brand-mark { font-size: 2.75rem; }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="#">
    <img src="bb_salon_logo.png" alt="BB Salon" class="brand-logo">
</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">
                            <i class="fa-solid fa-barcode me-1"></i> SKU Generator
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="receipt_generator.html">
                            <i class="fa-solid fa-circle-info me-1"></i> Receipt Generator
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10">
                <div class="app-shell row g-0">

                    <div class="col-12 col-md-7 form-side">
                        <form id="sku-form">
                            <div class="mb-3">
                                <label for="category" class="form-label">
                                    <i class="fa-solid fa-tags me-1"></i> Hair Products
                                </label>
                                <select id="category" class="form-select">
                                    <option value="Shampoo/Conditioner">Shampoo/Conditioner</option>
                                    <option value="Dove">Dove</option>
                                    <option value="Palmolive">Palmolive</option>
                                    <option value="Pantene">Pantene</option>
                                    <option value="Head & Shoulders">Head & Shoulders</option>
                                    <option value="SunSilk/CreamSilk">SunSilk/CreamSilk</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="product_name" class="form-label">
                                    <i class="fa-solid fa-box me-1"></i> Product Name
                                </label>
                                <input type="text" id="product_name" class="form-control" placeholder="e.g. Palmolive">
                            </div>

                            <div class="mb-4">
                                <label for="quantity" class="form-label">
                                    <i class="fa-solid fa-warehouse me-1"></i> Stock Quantity
                                </label>
                                <input type="number" id="quantity" class="form-control" placeholder="e.g. 50" min="0">
                            </div>

                            <div class="d-grid">
                                <input type="button" py-click="SKU_generator" value="Generate SKU"
                                       class="btn btn-generate btn-lg">
                            </div>
                        </form>

                        <hr class="my-4">

                        <div id="sku_output">
                            <p class="text-muted mb-0">Your generated SKU will appear here.</p>
                        </div>
                    </div>

                    <div class="col-12 col-md-5 brand-side">
                        <i class="fa-solid fa-barcode brand-icon mb-3"></i>
                        <div class="brand-mark">SKU<strong>Generator</strong></div>
                        <p class="brand-tagline">Use to keep track of current stocks for products.</p>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <footer class="text-center py-4">
        <div class="container">
            <p class="mb-1">
                <i class="fa-solid fa-code me-1"></i>
                SKU Generator, 1st Quarter Project, Llacer and Belleza
            </p>
        </div>
    </footer>
    <py-script src="main.py"></py-script>

        ...
    <py-script src="main.py"></py-script>

    <!-- Hi ma'am, Bootstrap JS bundle is needed here to ensure for the navbar toggle to work on mobile (it wasn't working exactly as planned on mobile so I did some research and found that I had to use this) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
</body>
</html>
